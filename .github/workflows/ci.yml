name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Системные библиотеки Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - run: uv sync --locked
      - name: ffmpeg для тестов потока (закреплённая сборка BtbN, как в установщиках)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then target=ffmpeg-windows; else target=ffmpeg-linux; fi
          uv run python packaging/fetch.py "$target" >> "$GITHUB_PATH"
      - name: Линтер
        run: uv run ruff check . && uv run ruff format --check .
      - name: Правила комментирования (docs/rules/comments.md)
        run: uv run python scripts/check_comments.py
      - name: Тесты
        run: uv run pytest -q  # на Linux conftest включает offscreen, на Windows — рабочий стол раннера

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Уязвимости зависимостей — pip-audit (база PyPA, токен не нужен)
        run: |
          uv export --no-hashes --no-dev --no-emit-project --format requirements-txt > requirements.txt
          # onvif-tt ставится из git по коммиту: в базе PyPI его нет, он проверяется ревью (AD-6);
          # его зависимости из PyPI pip-audit проверяет
          grep -v '^onvif-tt @' requirements.txt > audit.txt
          uvx --python 3.12 pip-audit@2.10.1 --strict -r audit.txt

  build-linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - run: packaging/linux/build.sh
      - name: Проверка сборки
        run: |
          app=$(ls dist/*.AppImage)
          "$app" --appimage-extract-and-run --version
          "$app" --appimage-extract-and-run doctor
      - uses: actions/upload-artifact@v4
        with:
          name: QA-tool-linux-AppImage
          path: dist/*.AppImage

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Сборка установщика
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Проверка сборки
        run: |
          build\pyinstaller\qa-tool\qa-tool-cli.exe --version
          build\pyinstaller\qa-tool\qa-tool-cli.exe doctor
      - uses: actions/upload-artifact@v4
        with:
          name: QA-tool-windows-setup
          path: dist/*-setup.exe
