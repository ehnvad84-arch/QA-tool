name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # набор идёт 25–35 мин; зависший тест браузера 08.11 держал задание 6 ч до отмены GitHub
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Системные библиотеки Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - run: uv sync --locked
      - name: ffmpeg для тестов потока (закреплённая сборка BtbN, как в установщиках)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then target=ffmpeg-windows; else target=ffmpeg-linux; fi
          uv run python packaging/fetch.py "$target" >> "$GITHUB_PATH"
      - name: Браузер для тестов веб-обхода
        run: uv run playwright install --with-deps --only-shell chromium
      - name: Линтер
        run: uv run ruff check . && uv run ruff format --check .
      - name: Правила комментирования (docs/rules/comments.md)
        run: uv run python scripts/check_comments.py
      - name: Больше сетевых портов (Windows)
        if: runner.os == 'Windows'
        # тесты открывают к mock-камерам сотни соединений в секунду, а Windows держит закрытое
        # соединение 2 минуты: 16 тысяч портов по умолчанию кончаются (WinError 10048)
        run: netsh int ipv4 set dynamicport tcp start=1025 num=64510
      - name: Тесты
        # на Linux conftest включает offscreen, на Windows — рабочий стол раннера; --durations
        # показывает самые долгие тесты. Сторож из conftest: тест дольше 4 мин называет себя,
        # печатает стеки потоков и greenlet и снимает прогон — 08.11 набор дважды висел на
        # раннерах после 65 % до предела задания, а faulthandler не показал стек теста
        env:
          QA_TOOL_TEST_WATCHDOG_S: "240"
        run: uv run pytest -q --durations=25

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Уязвимости зависимостей — pip-audit (база PyPA, токен не нужен)
        run: |
          uv export --no-hashes --no-dev --no-emit-project --format requirements-txt > requirements.txt
          # onvif-tt ставится из git по коммиту: в базе PyPI его нет, он проверяется ревью (AD-6);
          # его зависимости из PyPI pip-audit проверяет
          grep -v '^onvif-tt @' requirements.txt > audit.txt
          uvx --python 3.12 pip-audit@2.10.1 --strict -r audit.txt

  build-linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - run: packaging/linux/build.sh
      - name: Проверка сборки
        run: |
          app=$(ls dist/*.AppImage)
          "$app" --appimage-extract-and-run --version
          "$app" --appimage-extract-and-run doctor
      - name: Модуль ONVIF собранной программой против виртуальной камеры
        run: uv run python packaging/smoke_onvif.py "$(ls dist/*.AppImage)" --appimage-extract-and-run
      - name: Веб-обход собранной программой без скачиваний
        run: uv run python packaging/smoke_web.py "$(ls dist/*.AppImage)" --appimage-extract-and-run
      - name: Размер установщика
        run: du -h dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: QA-tool-linux-AppImage
          path: dist/*.AppImage

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Сборка установщика
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Проверка сборки
        run: |
          build\pyinstaller\qa-tool\qa-tool-cli.exe --version
          build\pyinstaller\qa-tool\qa-tool-cli.exe doctor
      - name: Модуль ONVIF собранной программой против виртуальной камеры
        run: uv run python packaging/smoke_onvif.py build\pyinstaller\qa-tool\qa-tool-cli.exe
      - name: Веб-обход собранной программой без скачиваний
        run: uv run python packaging/smoke_web.py build\pyinstaller\qa-tool\qa-tool-cli.exe
      - name: Размер установщика
        shell: pwsh
        run: Get-Item dist\*-setup.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB)}}
      - uses: actions/upload-artifact@v4
        with:
          name: QA-tool-windows-setup
          path: dist/*-setup.exe
