[project]
name = "qa-tool"
version = "0.1.0"
description = "Стенд проверки IP-камер: ONVIF, API, веб, интерфейсы, картинка — до 8 камер одновременно"
readme = "AGENTS.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.8",
    "httpx>=0.28",
    "defusedxml>=0.7",
    "keyring>=25",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pyyaml>=6",
]

[project.scripts]
qa-tool = "qa_tool.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]
build = [
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".workflow"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.hatch.build.targets.wheel.force-include]
"docs/manual" = "qa_tool/manual"
