[project]
name = "qa-tool"
version = "0.4.1"
description = "Стенд проверки IP-камер: ONVIF, API, веб, интерфейсы, картинка — до 8 камер одновременно"
readme = "AGENTS.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.8",
    "httpx>=0.28",
    "defusedxml>=0.7",
    "keyring>=25",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pyyaml>=6",
    # Проверки ONVIF (этап 2): закреплённый коммит — обновление только через ревью (AD-6).
    # onvif-tt запускает свои тесты через pytest.main, поэтому pytest нужен и программе.
    "onvif-tt @ git+https://github.com/OpenIPC/onvif-tt@8866b251bc63a3c746ca3f9b6544bdfcfcfa90df",
    "pytest>=8",
    "jsonschema>=4",
]

[project.scripts]
qa-tool = "qa_tool.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]
build = [
    "pyinstaller>=6.11",
]

[tool.hatch.metadata]
allow-direct-references = true  # onvif-tt ставится из git по коммиту

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# модуль pytest из onvif-tt нужен только его прогону (checks/onvif), в наших тестах — лишний
addopts = "-p no:onvif_tt_runner"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".workflow"]

[tool.ruff.lint]
# ERA — закомментированный код; D1 — обязательные docstring публичного API (docs/rules/comments.md)
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ERA", "D100", "D101", "D102", "D103", "D104", "D106"]

[tool.ruff.lint.per-file-ignores]
# docstring обязательны в ядре, драйверах, проверках и протоколах; экраны и тесты говорят сами за себя
"src/qa_tool/gui/**" = ["D1"]
"tests/**" = ["D1", "E501"]  # в тестах длинные строки — образцы XML, SOAP и RTSP целиком
"packaging/**" = ["D1"]
"scripts/**" = ["D1"]
"src/qa_tool/__init__.py" = ["D1"]

[tool.hatch.build.targets.wheel.force-include]
"docs/manual" = "qa_tool/manual"
